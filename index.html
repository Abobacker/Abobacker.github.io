<!doctype html><meta charset="utf-8"><title>Microbiology Minimum Blitz</title><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#000;color:#fff;font-family:system-ui"><div id="s" style="display:grid;place-items:center;min-height:100vh">Loading Microbiology Blitz…</div><script>(async()=>{try{let a=[];for(let i=1;i<=2;i++)a.push(await (await fetch(`payload/${i}.txt`)).text());let b=atob(a.join(''));let u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);let ds=new DecompressionStream('gzip');let out=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(out);document.close()}catch(e){document.getElementById('s').textContent='Failed to load: '+e}})()</script>
